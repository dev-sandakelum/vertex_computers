<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex Computers — Premium PC Components</title>
<meta name="description" content="Hand-picked PC components, compatibility-checked and backed by real builders.">
<meta name="theme-color" content="#081129">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23081129'/%3E%3Cpath d='M6 5l13 7-13 7 4.5-7z' fill='%232B59FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ base ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --fd:'Archivo',sans-serif;--fm:'JetBrains Mono',monospace;
  --blue:#2B59FF;--blue-d:#1D43D8;--blue-l:#6E8FFF;--blue-soft:#EAF0FF;
  --ink:#0D1730;--muted:#57617A;--paper:#F2F5FB;--line:#E0E7F3;
  --navy:#081129;--red:#CE3245;
  --shadow:0 14px 34px rgba(8,18,52,.10);
  --header-h:66px;--band-h:0px;
}
/* the two fixes: page scrollbar space always reserved (no pop-in/pop-out),
   and html-level lock so drawers/modals don't shift layout */
html{scrollbar-gutter:stable;overflow-y:auto;overflow-anchor:auto}
html.lock{overflow:hidden}
body{overflow-x:clip;font-family:var(--fd);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
main{min-height:60vh;flex:1}
img,svg{display:block}
button{font-family:inherit}
a{color:inherit}
::selection{background:var(--blue);color:#fff}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--fm)}.muted{color:var(--muted)}
.container{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px);width:100%}
.ic{width:18px;height:18px;flex:none}
.ic.sm{width:15px;height:15px}.ic.xs{width:11px;height:11px}.ic.big{width:26px;height:26px}
.bgp{background-color:#F7FAFF;background-image:linear-gradient(rgba(43,89,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(43,89,255,.05) 1px,transparent 1px);background-size:18px 18px}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:fill-box;transform-origin:center}

/* ============ mobile promo band ============ */
#band{position:sticky;top:0;z-index:56;display:none;background:#060D22;border-bottom:1px solid rgba(122,155,255,.13)}
@media(max-width:760px){#band{display:block}:root{--band-h:38px}}
.band-in{display:flex;align-items:center;gap:11px;height:var(--band-h);overflow-x:auto;scrollbar-width:none;font:500 10px var(--fm);letter-spacing:.09em;text-transform:uppercase;color:#8FA3D0;white-space:nowrap}
.band-in::-webkit-scrollbar{display:none}
.band-in>i{color:#3D5490;font-style:normal}
.bi{display:flex;align-items:center;gap:6px}
.bi .ic{width:12px;height:12px;color:var(--blue-l)}
.bi-b{background:none;border:0;color:#8FA3D0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;display:flex;align-items:center;gap:6px}
.bi-b:hover{color:#fff}
.liv{width:5px;height:5px;border-radius:50%;background:#2FC97E;animation:pulse 2s infinite}

/* ============ header ============ */
#hd{position:sticky;top:var(--band-h);z-index:55;background:rgba(8,17,41,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(122,155,255,.14)}
.hwrap{display:flex;align-items:center;gap:26px;height:var(--header-h)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.logo>svg{width:27px;height:27px}
.logo b{display:block;font:800 16px var(--fd);font-stretch:120%;color:#fff;letter-spacing:.06em;line-height:1}
.logo small{display:block;font:600 8px var(--fm);letter-spacing:.42em;color:#7285B5;margin-top:3px}
.hnav{display:flex;gap:26px}
.hnav a{position:relative;color:#B9C8F0;text-decoration:none;font:700 12.5px var(--fd);letter-spacing:.09em;text-transform:uppercase;padding:6px 0}
.hnav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--blue-l);transition:right .2s}
.hnav a:hover,.hnav a.cur{color:#fff}
.hnav a:hover::after,.hnav a.cur::after{right:0}
@media(max-width:899px){.hnav{display:none}}
.hright{margin-left:auto;display:flex;align-items:center;gap:9px}
.hsearch{display:flex;align-items:center;gap:8px;background:rgba(122,155,255,.08);border:1px solid rgba(122,155,255,.22);border-radius:11px;padding:0 6px 0 12px;height:40px;width:min(300px,32vw);transition:border-color .2s,width .25s;position:relative}
.hsearch:focus-within{border-color:rgba(122,155,255,.55);width:min(340px,38vw)}
.hsearch .ic{color:#7285B5}
.hsearch input{flex:1;min-width:0;background:none;border:0;color:#EAF0FF;font:500 13.5px var(--fd);outline:none}
.hsearch input::placeholder{color:#7285B5}
.hgo{background:none;border:0;color:#7285B5;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.hgo:hover{color:#fff;background:rgba(122,155,255,.14)}
.hbtn{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid rgba(122,155,255,.22);background:rgba(122,155,255,.07);color:#DFE8FF;display:grid;place-items:center;cursor:pointer;transition:.18s}
.hbtn:hover{border-color:rgba(122,155,255,.55)}
.cbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:99px;background:var(--blue);color:#fff;font:700 10px/17px var(--fm);text-align:center;padding:0 4px;border:2px solid #0A1530}
.cbadge.none{display:none}
.cbadge.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.5)}}
.stoggle{display:none}
@media(max-width:759px){.hsearch:not(#msearch){display:none}.stoggle{display:grid}}
.mbtn{display:grid}
@media(min-width:900px){.mbtn{display:none}}
#msearch{display:none;margin:0 16px 14px;width:calc(100% - 32px)}
#msearch.open{display:flex}
@media(min-width:760px){#msearch{display:none!important}}

/* avatar + user menu */
.avatar{display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--blue),#1D43D8);color:#fff;border-radius:50%;font-weight:800;letter-spacing:.02em}
.avatar.sm{width:26px;height:26px;font-size:10.5px}
.avatar.big{width:64px;height:64px;font-size:22px;background:#0D1E46}
.uwrap{position:relative;display:inline-flex}
.umenu{position:absolute;top:calc(100% + 10px);right:0;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 54px rgba(8,18,52,.22);padding:7px;z-index:70;display:none}
.umenu.open{display:block}
.umenu .uh{padding:9px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.umenu .uh b{font-size:13.5px;display:block}
.umenu .uh span{font-size:11px;color:var(--muted);word-break:break-all}
.umenu a,.umenu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:9px;color:var(--ink);text-decoration:none;font:600 13px var(--fd);background:none;border:0;cursor:pointer;text-align:left}
.umenu a:hover,.umenu button:hover{background:#F0F5FF;color:var(--blue)}
.umenu .mc{margin-left:auto;font:500 10.5px var(--fm);color:var(--muted)}
.umenu .sep{height:1px;background:var(--line);margin:5px 0}

/* ============ buttons & links ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px/1 var(--fd);border-radius:11px;padding:0 20px;height:44px;cursor:pointer;border:1px solid transparent;transition:transform .15s,background .2s,border-color .2s,color .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn .ic{width:15px;height:15px}
.btn-solid{background:var(--blue);color:#fff}
.btn-solid:hover{background:var(--blue-d)}
.btn-line{background:transparent;color:var(--ink);border-color:#C6D2EA}
.btn-line:hover{border-color:var(--blue);color:var(--blue)}
.btn-line.dark{background:rgba(122,155,255,.07);border-color:rgba(122,155,255,.28);color:#DFE8FF}
.btn-line.dark:hover{border-color:rgba(122,155,255,.6);color:#fff}
.btn-sm{height:38px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.btn-add{width:100%;height:40px;font-size:13.5px}
.btn-add:disabled{background:#E8ECF5;color:#98A3BC;cursor:not-allowed}
.all-link{display:inline-flex;align-items:center;gap:7px;font:700 13.5px var(--fd);color:var(--ink);text-decoration:none;border-bottom:2px solid var(--blue);padding-bottom:3px}
.all-link .ic{width:15px;height:15px;color:var(--blue);transition:transform .2s}
.all-link:hover .ic{transform:translateX(4px)}
.linkline{display:inline-flex;gap:6px;align-items:center;font:700 13px var(--fd);color:#9FB6F5;text-decoration:none;border-bottom:1px solid rgba(159,182,245,.35);padding-bottom:2px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.linkline:hover{color:#fff;border-bottom-color:#fff}
.linkline .ic{width:13px;height:13px}

/* ============ search hero ============ */
.eyebrow{display:flex;align-items:center;gap:9px;font:600 11px var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--blue-l);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--blue-l);animation:ring 2s infinite}
@keyframes ring{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.hero-s{position:relative;background:var(--navy);color:#E8EEFF;padding:clamp(54px,8vw,96px) 0 clamp(46px,6vw,74px);overflow:hidden}
.hero-s::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(122,155,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(122,155,255,.055) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.hero-s::after{content:"";position:absolute;top:-260px;left:50%;transform:translateX(-50%);width:940px;height:540px;background:radial-gradient(closest-side,rgba(43,89,255,.30),transparent 72%);pointer-events:none}
.hero-s .container{position:relative;z-index:1;max-width:940px;text-align:center}
.hero-s .eyebrow{justify-content:center;color:#93AAF3}
.h1s{font-size:clamp(2.2rem,5vw,3.9rem);font-weight:800;font-stretch:116%;text-transform:uppercase;line-height:1.02;letter-spacing:-.015em;margin:14px 0 16px}
.outline{color:transparent;-webkit-text-stroke:1.5px #9FB6F5}
.hero-p{color:#A9BCE8;max-width:52ch;font-size:clamp(14.5px,1.4vw,17px);line-height:1.65;margin:0 auto}
.sboxwrap{position:relative;max-width:660px;margin:30px auto 0}
.sbox{position:relative;display:flex;align-items:center;gap:10px;background:#fff;border-radius:15px;padding:6px 6px 6px 18px;box-shadow:0 22px 50px rgba(3,9,28,.45)}
.sbox>.ic{color:var(--blue)}
.sbox input{flex:1;min-width:0;border:0;outline:none;font:600 16px var(--fd);color:var(--ink);height:52px;background:none}
.sbox input::placeholder{color:#93A0BC}
.sbox .btn{height:48px;flex:none}
.trend{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.trend-label{font:600 10px var(--fm);letter-spacing:.2em;color:#6C7FB8;text-transform:uppercase}
.tchip{background:rgba(122,155,255,.09);border:1px solid rgba(122,155,255,.22);color:#C9D7FF;border-radius:99px;padding:8px 14px;font:600 12.5px var(--fd);cursor:pointer;transition:.15s;text-decoration:none}
.tchip:hover{background:rgba(43,89,255,.3);border-color:rgba(122,155,255,.5);color:#fff}
.catrow{margin-top:44px;padding-top:36px;border-top:1px solid rgba(122,155,255,.14)}
.catrow-label{text-align:center;font-size:10.5px;letter-spacing:.22em;color:#6C7FB8;text-transform:uppercase;margin-bottom:18px}
.catbtns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.catbtn{display:inline-flex;align-items:center;gap:8px;background:rgba(122,155,255,.07);border:1px solid rgba(122,155,255,.2);border-radius:12px;padding:10px 15px;color:#C9D7FF;text-decoration:none;font:700 13px var(--fd);transition:.15s}
.catbtn .ic{width:16px;height:16px;color:var(--blue-l)}
.catbtn:hover{background:rgba(43,89,255,.28);color:#fff;border-color:rgba(122,155,255,.45)}
.flagcard{max-width:680px;margin:38px auto 0;display:flex;gap:18px;align-items:center;background:#0D1E46;border:1px solid rgba(126,156,255,.3);border-radius:16px;padding:12px 18px;text-align:left;flex-wrap:wrap}
.flag-art{width:118px;flex:none;color:#8FA9FF}
.flag-art svg{width:100%;height:auto}
.flag-info{flex:1;min-width:200px}
.flagcard h3{font-size:19px;font-weight:800;font-stretch:114%;text-transform:uppercase;margin:7px 0 3px}
.flagcard .mono{font-size:11px;color:#7E96D6}
.flag-price{display:flex;gap:10px;align-items:baseline;margin-top:8px}
.flag-price b{font:700 21px var(--fm);color:#fff}
.flag-price s{color:#7285B5;font-size:13px}
.flag-act{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.pill-new{font:700 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--blue);padding:6px 10px;border-radius:99px;display:inline-block;width:max-content}
@media(max-width:560px){.flag-art{width:86px}.flag-act{flex-direction:row;width:100%;justify-content:space-between}}
.cross{position:absolute;width:15px;height:15px;opacity:.6}
.cross::before,.cross::after{content:"";position:absolute;background:#3D5490}
.cross::before{left:0;right:0;top:7px;height:1px}
.cross::after{top:0;bottom:0;left:7px;width:1px}
.c-tl{top:16px;left:16px}.c-tr{top:16px;right:16px}.c-bl{bottom:16px;left:16px}.c-br{bottom:16px;right:16px}

/* search suggestions */
.sugg{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 26px 60px rgba(6,14,40,.3);z-index:60;overflow:hidden;display:none;text-align:left}
.sugg.open{display:block}
.s-item{display:flex;align-items:center;gap:12px;padding:10px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid #F0F3FA}
.s-item:hover{background:#F5F8FF}
.s-art{width:52px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--blue);flex:none}
.s-art svg{width:44px;height:34px}
.s-mid{flex:1;min-width:0}
.s-mid b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-mid .mono{font-size:10.5px;color:var(--muted)}
.s-price{font-size:13px;font-weight:700}
.s-all{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font:700 12.5px var(--fd);color:var(--blue);text-decoration:none;background:#F5F8FF}
.s-empty{padding:16px;font-size:13px;color:var(--muted)}

/* ============ sections ============ */
.section{padding:clamp(52px,7vw,88px) 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(22px,3vw,34px);flex-wrap:wrap}
.h2{font-size:clamp(1.55rem,3vw,2.25rem);font-weight:800;font-stretch:114%;text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
.deal-side{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted)}
.count b{background:var(--navy);color:#8FB0FF;border-radius:7px;padding:5px 7px;margin:0 1px;font-weight:600}
.count i{color:var(--muted);font-style:normal;margin:0 2px;animation:pulse 1s steps(2) infinite}

/* brand carousel */
.brands{background:var(--navy);padding:34px 0 40px;border-top:1px solid rgba(122,155,255,.1)}
.brands-label{text-align:center;font-size:10.5px;letter-spacing:.22em;color:#6C7FB8;text-transform:uppercase;margin-bottom:24px}
.car{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.car-track{display:flex;width:max-content;animation:car 48s linear infinite}
.car:hover .car-track,.car:focus-within .car-track{animation-play-state:paused}
@keyframes car{to{transform:translateX(-50%)}}
.brand{display:flex;align-items:center;gap:9px;margin-right:58px;color:#8FA3D9;height:30px;user-select:none}
.brand svg{width:16px;height:16px;opacity:.75}
.brand span{font-size:15px;white-space:nowrap}
.brand:hover{color:#CFE0FF}
.bv0 span{font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.bv1 span{font-family:var(--fm);font-weight:600;font-size:13.5px}
.bv2 span{font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:12px}
.bv3 span{font-weight:700;letter-spacing:.01em}

/* product grid & card */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.pg4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1080px){.pg4{grid-template-columns:repeat(2,1fr)}}
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;transition:transform .2s,border-color .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-3px);border-color:#9DB5F2;box-shadow:var(--shadow)}
.pcard-top{display:flex;flex-direction:column;flex:1;text-decoration:none;color:inherit}
.pcard-media{aspect-ratio:4/3;display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);border-radius:15px 15px 0 0;overflow:hidden}
.pcard-media .art{width:80%;height:auto;max-height:84%;color:var(--blue);transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.pcard:hover .pcard-media .art{transform:scale(1.06) rotate(-1.5deg)}
.pcard:hover .pcard-media .spin{animation:spin var(--d,8s) linear infinite}
.tagpill{position:absolute;top:10px;left:10px;font:700 9.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:7px;color:#fff;background:var(--blue)}
.t-sale{background:#C2402F}
.pcard-body{padding:13px 15px 12px;display:flex;flex-direction:column;gap:6px}
.pbrand{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7A87A6}
.pname{font-size:14.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.prate{display:flex;align-items:center;gap:7px}
.prate .rt{font-size:11.5px;font-weight:600}
.prate .rw{font-size:11px;color:var(--muted)}
.stars{position:relative;display:inline-flex;line-height:0}
.stars svg{width:13px;height:13px}
.sb{display:inline-flex;color:#C7D2E9}
.sf{position:absolute;inset:0;overflow:hidden;color:#E8A23D;white-space:nowrap;display:flex}
.pspecs{display:flex;gap:6px;flex-wrap:wrap}
.sbadge{font:600 10.5px var(--fm);color:#1D43D8;background:var(--blue-soft);border:1px solid #D4DFFF;padding:4px 8px;border-radius:7px}
.pstock{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;width:max-content}
.pstock::before{content:"";width:7px;height:7px;border-radius:50%}
.st-in{color:#177A4B}.st-in::before{background:#1FA365}
.st-low{color:#A6690F}.st-low::before{background:#DB9A1E}
.st-out{color:#B02A3C}.st-out::before{background:#D6455A}
.pprice{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.pprice b{font-size:17px}
.pprice s{color:#98A3BC;font-size:12.5px}
.pcard-foot{padding:0 15px 15px}
.wish{position:absolute;top:9px;right:9px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:#8A96B4;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 8px rgba(8,18,52,.16);transition:.15s}
.wish:hover{color:#E0245E}
.wish.on{color:#E0245E}
.wish.on svg{fill:currentColor}
.wish-lg{position:static;width:46px;height:46px;flex:none}
@media(max-width:620px){
  .pgrid,.pg4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pcard-body{padding:10px 11px 9px;gap:4px}
  .pcard-foot{padding:0 11px 11px}
  .pname{font-size:12.5px}
  .pbrand{font-size:8.5px}
  .pspecs,.prate .rw{display:none}
  .pprice b{font-size:14.5px}
  .btn-add{height:34px;font-size:12px}

.c-thumb{width:74px;height:58px;flex:none;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--blue);text-decoration:none}
.c-thumb svg{width:82%;height:82%}
.c-thumb:hover .spin{animation:spin var(--d,8s) linear infinite}
.c-mid{flex:1;min-width:0}
.c-mid h4{font-size:13.5px;font-weight:700;margin:2px 0 8px;line-height:1.3}
.c-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.c-right b{font-size:13.5px}
.rm{border:0;background:none;color:#98A3BC;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.rm:hover{color:var(--red);background:#FDECEE}
.cart-empty{text-align:center;padding:60px 10px;color:var(--muted)}
.cart-empty .ic{margin:0 auto 14px;color:#B6C3DE}
.cart-empty h3{color:var(--ink);font-size:17px;text-transform:uppercase;margin-bottom:8px}
.cart-empty p{font-size:13.5px;line-height:1.6;max-width:30ch;margin:0 auto 20px}
#cartFoot{padding:16px 18px;border-top:1px solid var(--line);background:#FAFCFF;display:flex;flex-direction:column;gap:10px}
.shipbar{height:6px;background:#E2E9F6;border-radius:99px;overflow:hidden}
.shipfill{background:var(--blue);height:100%;border-radius:99px;transition:width .4s ease}
.shipnote{font-size:11px;color:var(--muted)}
.subrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.subrow .mono{font-size:17px;font-weight:700}
.note{font-size:10px;color:#98A3BC;letter-spacing:.04em;text-align:center}

/* auth modal */
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:18px;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s}
.modal.open{visibility:visible;opacity:1;transition:opacity .25s}
.modal::before{content:"";position:absolute;inset:0;background:rgba(4,9,26,.62);backdrop-filter:blur(4px)}
.mcard{position:relative;background:#fff;border-radius:20px;width:min(400px,100%);padding:26px;transform:translateY(12px) scale(.97);transition:transform .28s cubic-bezier(.3,1.2,.4,1);box-shadow:0 40px 90px rgba(4,10,30,.5)}
.modal.open .mcard{transform:none}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mhead h3{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.mtabs{display:flex;background:#EEF3FC;border-radius:11px;padding:4px;margin-bottom:18px}
.mtab{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:700 13px var(--fd);color:#57617A;cursor:pointer}
.mtab.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(8,18,52,.1)}
.afield{margin-bottom:13px}
.aerr{color:var(--red);font-size:12px;margin:-4px 0 10px;display:none}
.aerr.show{display:block}
.mnote{margin-top:14px;font-size:11px;color:#98A3BC;text-align:center;line-height:1.5}
.mpending{background:#F3F7FF;border:1px solid #CFE0FF;color:#27408F;font-size:12.5px;border-radius:10px;padding:9px 12px;margin-bottom:14px;display:flex;gap:8px;align-items:center}

/* ============ chat ============ */
#chatFab{position:fixed;right:18px;bottom:18px;z-index:70;width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 28px rgba(19,43,120,.35);transition:transform .2s,background .2s}
#chatFab:hover{transform:translateY(-3px);background:var(--blue-d)}
#chatPanel{position:fixed;right:18px;bottom:84px;width:min(352px,calc(100vw - 28px));height:min(470px,72vh);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px rgba(8,18,52,.3);z-index:85;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;transition:.28s}
#chatPanel.open{opacity:1;transform:none;pointer-events:auto}
.chat-hd{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:11px}
.chat-av{width:36px;height:36px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.chat-av .ic{width:16px;height:16px}
.chat-hd h4{font-size:14px;font-weight:800}
.chat-hd p{font:500 10.5px var(--fm);color:#93A7E4}
.chat-hd .iconbtn{margin-left:auto;background:rgba(122,155,255,.14);color:#fff}
.chat-hd .iconbtn:hover{background:rgba(122,155,255,.3);color:#fff}
.chat-bd{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F7F9FF}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start;color:#25304E}
.msg.user{background:var(--blue);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg a{color:var(--blue);font-weight:700}
.qrow{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 12px;background:#F7F9FF}
.qchip{border:1px solid #C9D4EC;background:#fff;border-radius:99px;padding:6px 11px;font:600 11.5px var(--fd);color:var(--ink);cursor:pointer}
.qchip:hover{border-color:var(--blue);color:var(--blue)}
.chat-ft{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat-ft input{flex:1;min-width:0;border:1px solid #C9D4EC;border-radius:10px;padding:0 12px;height:40px;font:500 13.5px var(--fd);outline:none}
.chat-ft input:focus{border-color:var(--blue)}
.chat-ft button{width:40px;height:40px;flex:none;border-radius:10px;background:var(--blue);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.chat-ft button:hover{background:var(--blue-d)}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:#9AA8C8;animation:ty 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* ============ toasts ============ */
#toasts{position:fixed;left:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:min(380px,calc(100vw - 36px))}
.toast{display:flex;gap:11px;align-items:flex-start;background:#0B1633;color:#EAF0FF;border:1px solid rgba(122,155,255,.25);border-radius:13px;padding:12px 14px;box-shadow:0 18px 40px rgba(4,10,30,.4);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.tico{width:30px;height:30px;flex:none;border-radius:9px;background:rgba(110,143,255,.16);color:#8FB0FF;display:grid;place-items:center}
.tico .ic{width:15px;height:15px}
.toast .tx p{font-size:13px;font-weight:600;line-height:1.4}
.tlink{background:none;border:0;color:#8FB0FF;font:700 12px var(--fd);text-decoration:underline;cursor:pointer;padding:3px 0 0}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
@media(max-width:620px){#toasts{left:12px;right:12px;max-width:none;bottom:84px}}

/* ============ footer ============ */
#ft{background:#05091C;color:#93A3CB;padding-top:clamp(48px,6vw,72px)}
.ft-grid{display:grid;grid-template-columns:1.5fr .8fr .8fr 1.2fr;gap:38px;padding-bottom:48px}
.ft h4{color:#E8EEFF;font:800 13px var(--fd);letter-spacing:.06em;text-transform:uppercase;margin-bottom:15px}
.ft a,.ft .linklike{display:block;color:#93A3CB;text-decoration:none;font-size:13.5px;padding:4px 0;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--fd)}
.ft a:hover,.ft .linklike:hover{color:#fff}
.ft-brand p{font-size:13.5px;line-height:1.7;max-width:34ch;margin:16px 0}
.ft-stat{font:600 11px var(--fm);letter-spacing:.1em;color:#5E6FA5;text-transform:uppercase}
.ft-news p{font-size:13px;line-height:1.6;margin-bottom:14px}
.ft-news form{display:flex;gap:8px}
.ft-news input{flex:1;min-width:0;height:42px;background:#0B1330;border:1px solid #22305C;border-radius:10px;padding:0 13px;color:#EAF0FF;font:500 13.5px var(--fd);outline:none}
.ft-news input:focus{border-color:var(--blue)}
.news-err{color:#FF9AA8;font-size:11.5px;margin:7px 0 0}
.news-ok{color:#7BE0A9;font-size:13px}
.ft-bot{border-top:1px solid #131C3C;padding:18px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 10.5px var(--fm);letter-spacing:.06em;color:#5E6FA5;text-transform:uppercase}
@media(max-width:960px){.ft-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.ft-grid{grid-template-columns:1fr;gap:30px}}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ============ footer (redesign) ============ */
#ft{padding-top:0;background:#05091C;position:relative}
#ft h4{color:#E8EEFF;font:800 12.5px var(--fd);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px}
#ft a,#ft .linklike{display:block;color:#93A3CB;text-decoration:none;font-size:13.5px;padding:5px 0;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--fd);transition:color .15s,transform .15s}
#ft a:hover,#ft .linklike:hover{color:#fff;transform:translateX(3px)}
#ft .logo{display:flex;padding:0}#ft .logo:hover{transform:none}
.ft-top{background:linear-gradient(135deg,#0E1E5A,#14307F 55%,#1B3FB0);border-bottom:1px solid rgba(122,155,255,.2)}
.ft-top-in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);padding-top:clamp(28px,4vw,44px);padding-bottom:clamp(28px,4vw,44px);align-items:center}
.ft-news h4{font-size:15px;margin-bottom:8px}.ft-news p{color:#C5D3F5}
.ft-news input{background:rgba(5,9,28,.55);border-color:rgba(122,155,255,.35)}
.ft-perks{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.ft-perks li{display:flex;gap:11px;align-items:flex-start;color:#C5D3F5;font-size:12.5px;line-height:1.35}
.ft-perks .ic{width:34px;height:34px;padding:8px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff}
.ft-perks b{display:block;color:#fff;font-size:13.5px}
#ft .ft-grid{grid-template-columns:1.5fr 1fr 1fr 1.1fr;gap:clamp(28px,4vw,48px);padding-top:clamp(36px,5vw,56px);padding-bottom:36px}
.ft-soc{display:flex;gap:8px;margin-top:6px}
.ft-soc span{width:36px;height:36px;border-radius:10px;border:1px solid #1C2A57;display:grid;place-items:center;font:700 11px var(--fm);color:#93A3CB}
.ft-pay{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-top:20px;padding-bottom:20px;border-top:1px solid #131C3C;font:500 10.5px var(--fm);letter-spacing:.08em;color:#5E6FA5;text-transform:uppercase}
.ft-pay i{font:700 10.5px var(--fm);font-style:normal;color:#9FB0DA;border:1px solid #1C2A57;border-radius:7px;padding:5px 9px;letter-spacing:.06em}
#ft .ft-bot{align-items:center}
.ft-bot button{background:none;border:1px solid #1C2A57;color:#9FB0DA;border-radius:9px;padding:7px 12px;font:600 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ft-bot button:hover{color:#fff;border-color:var(--blue-l)}
@media(max-width:960px){.ft-top-in{grid-template-columns:1fr}#ft .ft-grid{grid-template-columns:1fr 1fr}.ft-brand{grid-column:1/-1}}
@media(max-width:560px){#ft .ft-grid{grid-template-columns:1fr 1fr;gap:26px 18px}.ft-perks{grid-template-columns:1fr}.ft-bot{flex-direction:column;align-items:flex-start}}

/* ============ checkout ============ */
.ck-wrap{padding:26px 0 70px}
.ck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.ck-head h1{font:800 clamp(24px,4vw,32px) var(--fd)}
.ck-secure{display:flex;align-items:center;gap:7px;font:600 11px var(--fm);letter-spacing:.08em;color:#2A7A4F;text-transform:uppercase}
.ck-steps{display:flex;gap:8px;margin-bottom:22px;counter-reset:s}
.ck-step{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:700 12.5px var(--fd);color:var(--muted);cursor:default;min-width:0}
.ck-step i{flex:none;width:24px;height:24px;border-radius:50%;background:#E6ECF8;color:var(--muted);display:grid;place-items:center;font:700 11px var(--fm);font-style:normal}
.ck-step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-step.on{border-color:var(--blue);color:var(--ink)}.ck-step.on i{background:var(--blue);color:#fff}
.ck-step.done{color:var(--ink);cursor:pointer}.ck-step.done i{background:#2FC97E;color:#fff}
.ck-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
.ck-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px);margin-bottom:18px}
.ck-card h2{font:800 16px var(--fd);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ck-card h2 button{background:none;border:0;color:var(--blue);font:700 12px var(--fd);text-decoration:underline;cursor:pointer}
.ck-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ckf{min-width:0}.ckf.s2{grid-column:1/-1}
.ckf label{display:block;font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ckf input,.ckf select{width:100%;height:46px;border:1px solid #C9D4EC;border-radius:10px;padding:0 13px;font:500 15px var(--fd);color:var(--ink);background:#fff;outline:none}
.ckf input:focus,.ckf select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,89,255,.12)}
.ckf.bad input,.ckf.bad select{border-color:var(--red)}
.ck-err{display:block;color:var(--red);font-size:11.5px;min-height:0;margin-top:5px}.ck-err:empty{display:none}
.ck-opts{display:grid;gap:10px}
.ck-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.ck-opt:hover{border-color:#9DB4F5}
.ck-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.ck-opt input{accent-color:var(--blue);width:17px;height:17px;flex:none}
.ck-opt div{flex:1;min-width:0}.ck-opt b{display:block;font-size:14px}.ck-opt small{color:var(--muted);font-size:12px}
.ck-opt .mono{font-weight:700;font-size:13px}
.ck-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ck-nav .btn{min-width:150px}
.ck-sum{position:sticky;top:calc(var(--header-h) + var(--band-h) + 20px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.ck-sum h3{font:800 15px var(--fd);text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px}
.ck-items{display:grid;gap:10px;max-height:260px;overflow:auto;overscroll-behavior:contain;padding-right:4px;margin-bottom:14px}
.ck-it{display:flex;gap:10px;align-items:center;font-size:13px}
.ck-q{flex:none;min-width:24px;height:24px;border-radius:7px;background:var(--blue-soft);color:var(--blue);font:700 11px var(--fm);display:grid;place-items:center}
.ck-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-promo{display:flex;gap:8px;margin-bottom:6px}
.ck-promo input{flex:1;min-width:0;height:42px;border:1px solid #C9D4EC;border-radius:10px;padding:0 12px;font:600 13px var(--fm);text-transform:uppercase;outline:none}
.ck-promo input:focus{border-color:var(--blue)}
.ck-pmsg{font-size:12px;margin:0 0 12px}.ck-pmsg.ok{color:#2A7A4F}.ck-pmsg.no{color:var(--red)}
.ck-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;color:#333F5E}
.ck-row.disc{color:#2A7A4F}
.ck-row.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font:800 18px var(--fd);color:var(--ink)}
.ck-note{font:500 10.5px var(--fm);color:#98A3BC;margin-top:12px;line-height:1.5}
.ck-rev{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:14px;line-height:1.6}
.ck-rev small{display:block;font:600 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ck-terms{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#333F5E;cursor:pointer;margin:6px 0 16px}
.ck-terms input{accent-color:var(--blue);width:17px;height:17px;margin-top:2px;flex:none}
.ck-done{max-width:620px;margin:20px auto;text-align:center}
.ck-done .eico{width:76px;height:76px;background:#E3F8EC;color:#2A7A4F}
.ck-done h1{font:800 clamp(24px,5vw,32px) var(--fd);margin-bottom:8px}
.ck-done .ck-card{text-align:left;margin-top:22px}
.ck-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
@media(max-width:960px){.ck-grid{grid-template-columns:1fr}.ck-sum{position:static;order:-1}}
@media(max-width:560px){.ck-fields,.ck-rev{grid-template-columns:1fr}.ck-step span{display:none}.ck-step{justify-content:center}.ck-step.on span{display:block}.ck-nav .btn{flex:1}}

/* ============ responsive hardening ============ */
img,svg,video,canvas{max-width:100%}
.container,#app,.shop-main{min-width:0}
h1,h2,h3,h4,p,li{overflow-wrap:anywhere}
.btn{min-height:44px}
table{display:block;overflow-x:auto;max-width:100%}
.drawer{width:min(420px,100vw)}
.modal{padding:12px}.mcard{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto}
#chatPanel{max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px)}
@media(max-width:1180px){.container{padding:0 clamp(16px,3vw,28px)}}
@media(max-width:640px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pgrid .btn{padding:0 10px;font-size:13px}
  .shop-wrap,.ck-wrap{padding-top:16px}
  .toolbar{gap:10px}.sortw{width:100%;margin-left:0;justify-content:space-between}
  .sortw .select{flex:1}
}
@media(max-width:480px){
  .drawer{width:100vw}
  .hwrap{gap:10px}.hright{gap:6px}.hbtn{width:38px;height:38px}.logo small{display:none}
  #chatPanel{left:10px;right:10px;width:auto;bottom:80px}
  #chatFab{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}
  #toasts{left:10px;right:10px}
}
@media(max-width:360px){.pgrid{grid-template-columns:1fr}}
@media(min-width:1600px){.container{max-width:1360px}}
@media(max-height:520px) and (orientation:landscape){.side-card{max-height:calc(100vh - var(--header-h) - 24px)}.drawer .dr-bd{padding-bottom:12px}}

/* ============ TechNova-style theme ============ */
:root{--paper:#fff;--line:#E6EBF5;--band-h:34px;--header-h:72px;--grad:linear-gradient(135deg,#2B59FF,#7A4DFF)}
@media(min-width:1024px){:root{--header-h:120px}}
body{background:#fff}
.btn-solid{background:var(--grad);border:0}.btn-solid:hover{background:linear-gradient(135deg,#1D43D8,#6438F0);transform:translateY(-1px)}
.btn{border-radius:12px}
#band{display:block;background:#F5F8FF;border-bottom:1px solid var(--line)}
.band-in{color:#4A5878;font:500 11.5px var(--fd);letter-spacing:0;text-transform:none;gap:14px}
.band-in>i{color:#B6C1D9}.bi .ic{color:var(--blue)}.bi-b{color:#4A5878}.bi-b:hover{color:var(--blue)}.band-in .rt{margin-left:auto;display:flex;gap:16px}
#hd{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(8,18,52,.05)}
.hwrap{height:72px;gap:clamp(12px,3vw,40px)}
.logo b{color:var(--ink)}.logo small{color:#6B7896}
.hsearch{flex:1;width:auto;max-width:640px;height:46px;background:#fff;border:1px solid #D5DEF0;border-radius:12px;padding:0 0 0 14px;margin-right:auto}
.hsearch:focus-within{width:auto;border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,89,255,.12)}
.hsearch>.ic{display:none}.hsearch input{color:var(--ink);font-size:14px}.hsearch input::placeholder{color:#8794B0}
.hgo{width:52px;height:100%;background:var(--blue);color:#fff;border-radius:0 11px 11px 0}.hgo:hover{background:var(--blue-d);color:#fff}

function parseRoute(){
  const raw=(location.hash||'#/').slice(1);
  const qi=raw.indexOf('?');
  const path=qi<0?raw:raw.slice(0,qi);
  const params=new URLSearchParams(qi<0?'':raw.slice(qi+1));
  let cat=null,slug=null;
  if(path.startsWith('/shop/')){const s=path.slice(6);if(CATS.some(c=>c.slug===s))cat=s;}
  if(path.startsWith('/product/'))slug=decodeURIComponent(path.slice(9));
  return {path,cat,slug,params};
}
function go(path,params){location.hash='#'+path+(params&&params.toString()?'?'+params:'')}
function resetFilters(){F={cats:new Set(),brands:new Set(),pmin:null,pmax:null,stock:false,sale:false}}
function matchQ(p,q){
  const hay=[p.name,p.brand,p.category,...Object.values(p.specs),p.shortDescription].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
function baseList(){
  let l=PRODUCTS;
  if(route.cat)l=l.filter(p=>p.categorySlug===route.cat);
  const q=route.params.get('q');if(q)l=l.filter(p=>matchQ(p,q));
  if(route.params.get('tag')==='deal')l=l.filter(p=>p.oldPrice&&p.oldPrice>p.price);
  return l;
}
function facetBase(exclude){
  let l=baseList();
  if(!exclude.includes('cat')&&F.cats.size)l=l.filter(p=>F.cats.has(p.categorySlug));
  if(!exclude.includes('brand')&&F.brands.size)l=l.filter(p=>F.brands.has(p.brand));
  if(F.pmin!=null)l=l.filter(p=>p.price>=F.pmin);
  if(F.pmax!=null)l=l.filter(p=>p.price<=F.pmax);
  if(F.stock)l=l.filter(p=>p.stock!=='out');
  if(F.sale)l=l.filter(p=>p.oldPrice&&p.oldPrice>p.price);
  return l;
}
const countCat=slug=>facetBase(['cat']).filter(p=>p.categorySlug===slug).length;
const countBrand=b=>facetBase(['brand']).filter(p=>p.brand===b).length;
function filteredList(){
  let l=facetBase([]);
  const c={pop:(a,b)=>b.reviewCount-a.reviewCount,plow:(a,b)=>a.price-b.price,phigh:(a,b)=>b.price-a.price,new:(a,b)=>b.id-a.id,rated:(a,b)=>b.rating-a.rating}[sort];
  return [...l].sort(c);
}

function chipsData(){
  const out=[];
  const q=route.params.get('q');if(q)out.push({l:`Search: “${esc(q)}”`,k:'q'});
  if(route.params.get('tag')==='deal')out.push({l:'Hot deals',k:'tag'});
  if(!route.cat)F.cats.forEach(s=>out.push({l:CATLABEL[s]||s,k:'cat:'+s}));
  F.brands.forEach(b=>out.push({l:esc(b),k:'brand:'+b}));
  if(F.pmin!=null||F.pmax!=null)out.push({l:F.pmin!=null&&F.pmax!=null?`$${F.pmin} – $${F.pmax}`:F.pmin!=null?`$${F.pmin}+`:`Under $${F.pmax}`,k:'price'});
  if(F.stock)out.push({l:'In stock',k:'stock'});
  if(F.sale)out.push({l:'On sale',k:'sale'});
  return out;
}
const anyActive=()=>chipsData().length>0;
function pagerHTML(total,pages){
  if(pages<=1)return'';
  const b=(p,lab,dis,cur,aria)=>`<button class="pg${cur?' cur':''}" data-action="page" data-page="${p}" ${dis?'disabled':''} aria-label="${aria}">${lab}</button>`;
  let h=b(page-1,ic('chevL','xs'),page===1,false,'Previous page');
  for(let i=1;i<=pages;i++)h+=b(i,i,false,i===page,'Page '+i);
  h+=b(page+1,ic('chevR','xs'),page===pages,false,'Next page');
  return h+`<span class="pginfo mono">Page ${page} of ${pages} · ${total} items</span>`;
}
const emptyState=()=>`<div class="empty">
  <span class="eico">${ic('search','big')}</span>

  <button class="btn btn-solid" data-action="clear">Clear all filters</button>
</div>`;
function updateResults(){
  if(!$('#grid'))return;
  const list=filteredList();
  const total=list.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(page>pages)page=pages;
  const slice=list.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  $('#grid').innerHTML=slice.length?slice.map(productCard).join(''):emptyState();
  $('#pager').innerHTML=pagerHTML(total,pages);
  const cnt=total+(total===1?' result':' results');
  $('#countDesk').textContent=cnt;
  $('#countMob').textContent=`${total} results`;
  $('#fShow').textContent=total;
  $('#headCount').textContent=`${total} components · ships within 24h`;
  $('#chips').innerHTML=chipsData().map(c=>`<span class="fchip">${c.l}<button data-action="chip" data-k="${esc(c.k)}" aria-label="Remove filter ${c.l}">${ic('close','xs')}</button></span>`).join('');
  const n=chipsData().length,badge=$('#fbadge');
  badge.hidden=!n;badge.textContent=n;
  $('#clearSide').hidden=!anyActive();
  $('#brandList').innerHTML=brandRows();
  const bm=$('#brandListM');if(bm)bm.innerHTML=brandRows();
  $$('[data-count]').forEach(el=>{
    const [k,v]=el.dataset.count.split(':');
    if(k==='cat')el.textContent=countCat(v);
    else if(k==='brand')el.textContent=countBrand(v);
  });
  $$('.price-in').forEach(inp=>{if(document.activeElement!==inp)inp.value=inp.dataset.pkey==='min'?(F.pmin??''):(F.pmax??'');});
}
function removeChip(k){
  if(k==='q'||k==='tag'){const p=new URLSearchParams(route.params);p.delete(k);go(route.path,p);return;}
  if(k.startsWith('cat:')){const v=k.slice(4);F.cats.delete(v);syncChecks('cat',v,false);}
  else if(k.startsWith('brand:'))F.brands.delete(k.slice(6));
  else if(k==='price'){F.pmin=null;F.pmax=null;}
  else if(k==='stock'){F.stock=false;syncChecks('avail','stock',false);}
  else if(k==='sale'){F.sale=false;syncChecks('avail','sale',false);}
  page=1;updateResults();
}
function syncChecks(key,val,state){$$(`input[data-fkey="${key}"][data-fval="${val}"]`).forEach(i=>i.checked=state)}
function clearAll(){
  $$('.fgroup input[type=checkbox]').forEach(i=>i.checked=false);
  resetFilters();
  if(route.params.toString())go(route.path,new URLSearchParams());
  else{page=1;updateResults();}
}

const cartQty=()=>Object.values(cart).reduce((a,b)=>a+b,0);
function badge(){const n=cartQty(),b=$('#cartCount');b.textContent=n;b.classList.toggle('none',!n)}
function bumpBadge(){badge();const b=$('#cartCount');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function toast(msg,icon='check',extra=''){
  const w=$('#toasts'),t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<span class="tico">${ic(icon)}</span><div class="tx"><p>${msg}</p>${extra}</div>`;
  w.appendChild(t);
  while(w.children.length>3)w.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},3200);
}
function addToCart(id,qty=1,silent=false){
  const p=byId(id);if(!p||p.stock==='out')return;
  cart[id]=(cart[id]||0)+qty;saveCart();bumpBadge();
  if(!silent)toast(`${esc(p.name)} added to cart`,'cart','<button class="tlink" data-action="cart-open">View cart</button>');
  if($('#cartDrawer').classList.contains('open'))renderCart();
}
function renderCart(){
  const ids=Object.keys(cart);
  const body=$('#cartBody'),foot=$('#cartFoot');
  if(!ids.length){
    body.innerHTML=`<div class="cart-empty">${ic('cart','big')}<h3>Cart is empty</h3><p>Pick a category and start a build — everything gets compatibility-checked at checkout.</p><button class="btn btn-line" data-action="close">Keep browsing</button></div>`;
    foot.innerHTML='';return;
  }
  let rows='',subtotal=0;
  ids.forEach(id=>{
    const p=byId(id),q=cart[id],line=p.price*q;subtotal+=line;
    rows+=`<div class="crow">
      <a class="c-thumb bgp" href="#/product/${p.slug}" data-action="close">${art(p)}</a>
      <div class="c-mid"><p class="pbrand mono">${p.brand}</p><h4>${p.name}</h4>
        <div class="qty"><button data-action="qty" data-id="${id}" data-d="-1" aria-label="Decrease quantity">${ic('minus','xs')}</button><span class="mono">${q}</span><button data-action="qty" data-id="${id}" data-d="1" aria-label="Increase quantity">${ic('plus','xs')}</button></div>
      </div>
      <div class="c-right"><b class="mono">${money(line)}</b><button class="rm" data-action="rm" data-id="${id}" aria-label="Remove ${esc(p.name)}">${ic('trash','xs')}</button></div>
    </div>`;
  });
  body.innerHTML=rows;
  const free=subtotal>=99,pct=Math.min(100,subtotal/99*100);
  foot.innerHTML=`
    <div class="shipbar"><div class="shipfill" style="width:${pct}%"></div></div>
    <p class="shipnote mono">${free?'Free shipping unlocked':money(99-subtotal)+' away from free shipping'}</p>
    <div class="subrow"><span>Subtotal</span><b class="mono">${money(subtotal)}</b></div>
    <button class="btn btn-solid btn-block" data-action="checkout">Checkout · ${money(subtotal)}</button>
    <p class="note mono">Taxes at checkout · Demo storefront, no real charge</p>`;
}

function handleAuth(form){
  const mode=form.dataset.mode;
  const email=form.querySelector('[type=email]').value.trim();
  const pass=form.querySelector('[type=password]').value;
  const nameIn=form.querySelector('[name=name]');
  const err=form.querySelector('.aerr');
  let msg='';
  if(!email.includes('@')||email.length<5)msg='Enter a valid email address.';
  else if(pass.length<4)msg='Password needs at least 4 characters.';
  else if(mode==='register'&&!nameIn.value.trim())msg='Tell us your name.';
  if(msg){err.textContent=msg;err.classList.add('show');return;}
  const pretty=email.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  user={name:mode==='register'?nameIn.value.trim():pretty,email,joined:(user&&user.joined)||new Date().toISOString()};
  saveUser();renderUserArea();closeAuth();
  toast(`Welcome${mode==='register'?' aboard':''}, ${esc(user.name.split(' ')[0])}!`,'user');
  const act=pendingAuth;pendingAuth=null;
  if(act==='checkout')placeOrder();
  else if(act==='account')go('/account');
}
function signout(){
  user=null;localStorage.removeItem('vertex-user');
  renderUserArea();
  toast('Signed out — see you soon','user');
  if(route.path==='/account')go('/');
}
function placeOrder(){
  if(!Object.keys(cart).length)return;
  closePanels();
  if((location.hash||'#/').split('?')[0]==='#/checkout')render();else go('/checkout');
}
function rebuy(oid){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  o.items.forEach(it=>addToCart(it.id,it.qty,true));
  toast('Previous order added to cart','cart');
  renderCart();openPanel('#cartDrawer');
}
function toggleWish(id){
  const i=wishlist.indexOf(id);
  if(i<0){wishlist.push(id);toast('Saved to your wishlist','heart');}
  else{wishlist.splice(i,1);toast('Removed from wishlist','heart');}
  saveWish();
  $$(`.wish[data-id="${id}"]`).forEach(b=>b.classList.toggle('on',wishlist.includes(id)));
  renderUserArea();
  if(route.path==='/account'&&accountTab==='wishlist')renderAcct();
}

    +`<a class="s-all" href="#/shop?q=${encodeURIComponent(q)}">See all ${m.length} results ${ic('arrowR','xs')}</a>`;
}
const closeSuggs=()=>$$('.sugg.open').forEach(s=>s.classList.remove('open'));
function bindSuggest(form){
  const sug=form.querySelector('.sugg'),input=form.querySelector('input');
  if(!sug||!input)return;
  input.addEventListener('input',()=>{
    const q=input.value.trim();
    if(q.length<2){sug.classList.remove('open');sug.innerHTML='';return;}
    sug.innerHTML=suggHTML(q.toLowerCase());
    sug.classList.add('open');
  });
  sug.addEventListener('click',e=>{if(e.target.closest('a')){sug.classList.remove('open');form.classList.remove('open');}});
}

  [/ship|deliver|canada|country|international/i,`We ship across North America and the EU. Orders over $99 ship free; under that it's a flat $8.90. In-stock parts leave the warehouse within 24h, and tracking lands in your inbox the moment it does.`],
  [/track|order status/i,`Tracking links go out automatically when an order ships. If you've lost one, tell me the order number — it starts with VCX — and I'll dig it up. You'll also find every order in your account page.`],
  [/return|refund|exchange/i,`30 days, no questions asked — if the build plan changed, send it back. Unopened parts get a full refund; opened ones get store credit at worst, and we cover return labels on our dime.`],
  [/warranty|broken|faulty|dead|rma/i,`Every component carries a 2-year Vertex warranty on top of the manufacturer's own — no registration, no fine print. If something dies, we cross-ship the replacement so downtime stays measured in days, not weeks.`],
  [/deal|sale|discount|cheap|budget|price/i,`Today's steals live on the <a href="#/shop?tag=deal">Hot Deals page</a> — the 9800X3D, the Arctic Liquid Freezer III and G.Skill 6000MHz kits are all at their lowest prices this quarter.`],
  [/hello|hi|hey|yo/i,`Hey! Good timing — we just dropped the Nova 9090. Are you starting a fresh build or upgrading a part?`]
];
const FALLBACK=`I can help with GPUs, CPUs, compatibility, shipping, returns or warranty — or tell me what you're building and I'll suggest a starting point.`;
function pushMsg(html,who){
  const b=$('#chatBody');
  b.insertAdjacentHTML('beforeend',`<div class="msg ${who}">${html}</div>`);
  b.scrollTop=b.scrollHeight;
}
function botSay(html){
  const b=$('#chatBody');
  b.insertAdjacentHTML('beforeend',`<div class="msg bot typing" id="typing"><span></span><span></span><span></span></div>`);
  b.scrollTop=b.scrollHeight;
  setTimeout(()=>{const t=$('#typing');t&&t.remove();pushMsg(html,'bot');},600+Math.random()*450);
}
function sendChat(text){
  text=(text||'').trim();if(!text)return;
  pushMsg(esc(text),'user');
  $('#chatIn').value='';
  const r=RULES.find(([re])=>re.test(text));
  botSay(r?r[1]:FALLBACK);
}
function toggleChat(force){
  const p=$('#chatPanel'),fab=$('#chatFab');
  const open=force===true?true:force===false?false:!p.classList.contains('open');
  p.classList.toggle('open',open);
  fab.setAttribute('aria-expanded',open);
  if(open){
    if(!chatSeeded){chatSeeded=true;pushMsg(CHAT_INTRO,'bot');}
    setTimeout(()=>$('#chatIn')&&$('#chatIn').focus(),80);
  }
}

/* ================= router & render ================= */
function stopCountdown(){if(cdTimer){clearInterval(cdTimer);cdTimer=null}}
function initCountdown(){
  stopCountdown();
  const el=$('#cdown');if(!el)return;
  const end=new Date();end.setHours(23,59,59,0);
  if(end-Date.now()<3600e3)end.setDate(end.getDate()+1);
  const t=()=>{
    const s=Math.max(0,Math.floor((end-Date.now())/1000));
    const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
    el.innerHTML=`Ends in <b>${h}</b><i>:</i><b>${m}</b><i>:</i><b>${ss}</b>`;
  };
  t();cdTimer=setInterval(t,1000);
}
function initReveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.12});
  $$('.reveal:not(.in)').forEach(el=>io.observe(el));
}
function updateNav(){
  const cur=route.path==='/'?'home':route.params.get('tag')==='deal'?'deals':'shop';
  $$('.hnav a').forEach(a=>a.classList.toggle('cur',a.dataset.nav===cur));
}
function render(){
  stopCountdown();closePanels();closeSuggs();
  const um=$('#umenu');um&&um.classList.remove('open');
  const app=$('#app');
  if(route.slug){
    const p=bySlug(route.slug);
    if(p){app.innerHTML=productView(p);document.title=p.name+' — Vertex Computers';}
    else{app.innerHTML=notFound();document.title='Not found — Vertex Computers';}
  }else if(route.path==='/account'){
    const t=route.params.get('tab');
    accountTab=['orders','wishlist','addresses','profile'].includes(t)?t:'orders';
    app.innerHTML=accountView();document.title='My Account — Vertex Computers';
  }else if(route.path==='/checkout'){
    ckEnter();document.title='Checkout — Vertex Computers';
  }else if(route.path==='/shop'||route.path.startsWith('/shop/')){
    app.innerHTML=shopView();
    $('#fBody').innerHTML=facetPanels();
    const fl=$('#fBody .flist');if(fl)fl.id='brandListM';
    const q=route.params.get('q');
    document.title=(q?`Search “${q}”`:(route.cat?CATLABEL[route.cat]:'All Components'))+' — Vertex Computers';
    updateResults();
  }else{
    app.innerHTML=homeView();
    document.title='Vertex Computers — Premium PC Components';
    initCountdown();initBrandCarousel();
    const hs=$('#heroSearch');hs&&bindSuggest(hs);
  }
  updateNav();initReveal();
  window.scrollTo(0,0);
}
function onRoute(){
  const r=parseRoute();
  const pathChanged=!route||route.path!==r.path;
  route=r;
  if(pathChanged)resetFilters();
  page=1;
  render();
}
window.addEventListener('hashchange',onRoute);

  else if(a==='auth-close')closeAuth();
  else if(a==='auth-tab'){authMode=el.dataset.mode;$('#authBody').innerHTML=authHTML();}
  else if(a==='signout')signout();
  else if(a==='acctab'){accountTab=el.dataset.tab;renderAcct();}
  else if(a==='rebuy')rebuy(el.dataset.oid);
  else if(a==='gal')setGal(+el.dataset.i);
  else if(a==='gal-prev')setGal(galIdx-1);
  else if(a==='gal-next')setGal(galIdx+1);
  else if(a==='pdpqty'){
    const q=$('#pdpQtyVal');if(!q)return;
    let v=+q.textContent+ +el.dataset.d;
    const max=curProduct&&curProduct.stockCount?Math.min(9,curProduct.stockCount):9;
    q.textContent=Math.max(1,Math.min(max,v));
  }
  else if(a==='fbtw-add'){el.dataset.ids.split(',').forEach(i=>addToCart(+i,1,true));toast('Bundle added to cart','cart');}
  else if(a==='helpful')toast('Thanks for the feedback','check');
  else if(a==='write-review')toast('Reviews are read-only in this demo','chat');
  else if(a==='jump-reviews'){const r=$('#reviews');r&&r.scrollIntoView({behavior:REDUCED?'auto':'smooth'});}
  else if(a==='addr-add')toast('Demo — the address book is decorative','pin');
  else if(a==='cart-open'){renderCart();openPanel('#cartDrawer');}
  else if(a==='menu-open')openPanel('#menuDrawer');
  else if(a==='filters-open')openPanel('#fDrawer');
  else if(a==='close')closePanels();
  else if(a==='chat-open')toggleChat();
  else if(a==='chat-ask'){toggleChat(true);setTimeout(()=>sendChat(el.dataset.q||''),350);}
  else if(a==='qsend')sendChat(el.dataset.q||'');
  else if(a==='chip')removeChip(el.dataset.k);
  else if(a==='page'){page=+el.dataset.page;updateResults();scrollToResults();}
  else if(a==='clear')clearAll();
  else if(a==='filters-apply')closePanels();
  else if(a==='qty'){const d=+el.dataset.d,nid=el.dataset.id;cart[nid]+=d;if(cart[nid]<=0)delete cart[nid];saveCart();badge();renderCart();}

});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.fkey){
    const k=t.dataset.fkey,v=t.dataset.fval;
    if(k==='cat')t.checked?F.cats.add(v):F.cats.delete(v);
    else if(k==='brand')t.checked?F.brands.add(v):F.brands.delete(v);
    else if(k==='avail'){if(v==='stock')F.stock=t.checked;if(v==='sale')F.sale=t.checked;}
    page=1;updateResults();return;
  }
  if(t.classList.contains('price-in')){
    const n=parseInt(t.value,10);
    if(t.dataset.pkey==='min')F.pmin=isNaN(n)?null:n;else F.pmax=isNaN(n)?null:n;
    page=1;updateResults();return;
  }
  if(t.id==='sortDesk'||t.id==='sortMob'){
    sort=t.value;
    const o=t.id==='sortDesk'?$('#sortMob'):$('#sortDesk');if(o)o.value=sort;
    page=1;updateResults();
  }
});

/* ================= advanced checkout ================= */
const DELIV={std:{n:'Standard',d:'3–5 business days',p:8.9,days:4},exp:{n:'Express',d:'1–2 business days',p:19,days:2},ovn:{n:'Overnight',d:'Next business day',p:39,days:1}};
const PROMOS={VERTEX10:{t:'pct',v:.1,l:'10% off parts'},FREESHIP:{t:'ship',l:'Free standard delivery'},BUILD25:{t:'amt',v:25,min:300,l:'$25 off orders over $300'}};
const COUNTRIES=['Sri Lanka','United States','United Kingdom','India','Australia','Canada','Singapore','Germany','Other'];
const PAYS={card:['Credit / debit card','Visa, Mastercard, Amex'],bank:['Bank transfer','Pay within 24h — order held until received'],cod:['Cash on delivery','Pay the courier on arrival']};
let CK={step:1,method:'std',pay:'card',promo:null,pmsg:null,ship:{},card:{},err:{},terms:false,busy:false,done:null};
try{CK.ship=JSON.parse(localStorage.getItem('vertex-ship'))||{}}catch(e){}
const ckLines=()=>Object.keys(cart).map(id=>({p:byId(+id),q:cart[id]})).filter(l=>l.p);
function ckTotals(){
  const sub=ckLines().reduce((a,l)=>a+l.p.price*l.q,0);
  let disc=0,ship=DELIV[CK.method].p;
  if(CK.method==='std'&&sub>=99)ship=0;
  const pr=CK.promo&&PROMOS[CK.promo];
  if(pr){if(pr.t==='pct')disc=+(sub*pr.v).toFixed(2);else if(pr.t==='amt'&&sub>=pr.min)disc=pr.v;else if(pr.t==='ship'&&CK.method==='std')ship=0;}
  return{sub,disc,ship,total:Math.max(0,sub-disc)+ship};
}
function ckEnter(){
  CK.done=null;CK.step=1;CK.err={};CK.terms=false;CK.busy=false;
  if(user){CK.ship.name=CK.ship.name||user.name||'';CK.ship.email=CK.ship.email||user.email||'';}
  ckRender();
}
const luhn=n=>{let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0};
function ckValidate(step){
  const e={},S=CK.ship,C=CK.card;
  if(step===1){
    if((S.name||'').trim().length<2)e.name='Enter your full name';
    if(!/^\S+@\S+\.\S+$/.test(S.email||''))e.email='Enter a valid email';
    if((S.phone||'').replace(/\D/g,'').length<7)e.phone='Enter a valid phone number';
    if((S.address||'').trim().length<5)e.address='Enter your street address';
    if(!(S.city||'').trim())e.city='Enter your city';
    if((S.postal||'').trim().length<3)e.postal='Enter a postal code';
    if(!S.country)e.country='Choose a country';
  }else if(step===2&&CK.pay==='card'){
    const n=(C.num||'').replace(/\s/g,'');
    if(n.length<13||!luhn(n))e['c.num']='Enter a valid card number';
    if((C.name||'').trim().length<2)e['c.name']='Enter the name on the card';
    const m=/^(\d{2})\/(\d{2})$/.exec(C.exp||'');
    if(!m||+m[1]<1||+m[1]>12||new Date(2000+ +m[2],+m[1],1)<=new Date())e['c.exp']='Enter a valid expiry (MM/YY)';
    if(!/^\d{3,4}$/.test(C.cvc||''))e['c.cvc']='Enter the 3–4 digit code';
  }else if(step===3&&!CK.terms)e.terms='Please accept the terms to place your order';
  CK.err=e;return !Object.keys(e).length;
}
function ckField(k,l,o={}){
  const card=k.startsWith('c.'),v=(card?CK.card:CK.ship)[k.replace('c.','')]||'';
  return `<div class="ckf ${o.s2?'s2':''} ${CK.err[k]?'bad':''}"><label for="ck-${k}">${l}</label>${o.sel?`<select id="ck-${k}" data-ck="${k}" autocomplete="${o.ac||'off'}"><option value="">Select…</option>${COUNTRIES.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select>`:`<input id="ck-${k}" data-ck="${k}" type="${o.t||'text'}" inputmode="${o.im||'text'}" placeholder="${o.ph||''}" autocomplete="${o.ac||'off'}" value="${esc(v)}">`}<span class="ck-err" data-for="${k}">${CK.err[k]||''}</span></div>`;
}
function ckSum(){
  const t=ckTotals(),pr=CK.promo;
  return `<aside class="ck-sum"><h3>Order summary</h3>
  <div class="ck-items">${ckLines().map(l=>`<div class="ck-it"><span class="ck-q">${l.q}</span><span class="ck-n">${esc(l.p.name)}</span><b class="mono">${money(l.p.price*l.q)}</b></div>`).join('')}</div>
  <div class="ck-promo"><input id="ckPromo" placeholder="Promo code" aria-label="Promo code" value="${pr?esc(pr):''}" ${pr?'readonly':''}><button class="btn btn-line" data-ck-do="${pr?'unpromo':'promo'}">${pr?'Remove':'Apply'}</button></div>
  <p class="ck-pmsg ${CK.pmsg&&CK.pmsg.ok?'ok':'no'}">${CK.pmsg?esc(CK.pmsg.t):'Try VERTEX10, FREESHIP or BUILD25'}</p>
  <div class="ck-row"><span>Subtotal</span><b class="mono">${money(t.sub)}</b></div>
  ${t.disc?`<div class="ck-row disc"><span>Discount</span><b class="mono">−${money(t.disc)}</b></div>`:''}
  <div class="ck-row"><span>Delivery · ${DELIV[CK.method].n}</span><b class="mono">${t.ship?money(t.ship):'Free'}</b></div>
  <div class="ck-row tot"><span>Total</span><span class="mono">${money(t.total)}</span></div>
  <p class="ck-note">Demo checkout — no real payment is taken and card numbers are never stored.</p></aside>`;
}
function ckMain(){
  const S=CK.ship,C=CK.card;
  if(CK.step===1)return `<div class="ck-card"><h2>Shipping details</h2><div class="ck-fields">
    ${ckField('name','Full name',{s2:1,ac:'name'})}${ckField('email','Email',{t:'email',im:'email',ac:'email'})}${ckField('phone','Phone',{t:'tel',im:'tel',ac:'tel'})}
    ${ckField('address','Street address',{s2:1,ac:'street-address'})}${ckField('city','City',{ac:'address-level2'})}${ckField('state','State / region',{ac:'address-level1'})}
    ${ckField('postal','Postal code',{ac:'postal-code'})}${ckField('country','Country',{sel:1,ac:'country-name'})}</div></div>
    <div class="ck-card"><h2>Delivery method</h2><div class="ck-opts">${Object.entries(DELIV).map(([k,d])=>{const sub=ckTotals().sub,pr=k==='std'&&sub>=99?0:d.p;return `<label class="ck-opt ${CK.method===k?'on':''}"><input type="radio" name="ckm" value="${k}" ${CK.method===k?'checked':''}><div><b>${d.n}</b><small>${d.d}</small></div><span class="mono">${pr?money(pr):'Free'}</span></label>`}).join('')}</div></div>`;
  if(CK.step===2)return `<div class="ck-card"><h2>Payment method</h2><div class="ck-opts">${Object.entries(PAYS).map(([k,d])=>`<label class="ck-opt ${CK.pay===k?'on':''}"><input type="radio" name="ckp" value="${k}" ${CK.pay===k?'checked':''}><div><b>${d[0]}</b><small>${d[1]}</small></div></label>`).join('')}</div></div>
    ${CK.pay==='card'?`<div class="ck-card"><h2>Card details</h2><div class="ck-fields">${ckField('c.num','Card number',{s2:1,im:'numeric',ph:'1234 5678 9012 3456',ac:'cc-number'})}${ckField('c.name','Name on card',{s2:1,ac:'cc-name'})}${ckField('c.exp','Expiry',{im:'numeric',ph:'MM/YY',ac:'cc-exp'})}${ckField('c.cvc','CVC',{im:'numeric',ph:'123',ac:'cc-csc'})}</div></div>`:''}`;
  const last=(C.num||'').replace(/\s/g,'').slice(-4);
  return `<div class="ck-card"><h2>Review your order</h2><div class="ck-rev">
    <div><small>Ship to</small>${esc(S.name)}<br>${esc(S.address)}<br>${esc(S.city)}${S.state?', '+esc(S.state):''} ${esc(S.postal)}<br>${esc(S.country)}<br><button class="linklike" style="color:var(--blue);padding:0" data-ck-do="goto" data-s="1">Edit</button></div>
    <div><small>Delivery</small>${DELIV[CK.method].n} · ${DELIV[CK.method].d}<br><small style="margin-top:10px">Payment</small>${CK.pay==='card'?'Card •••• '+esc(last):PAYS[CK.pay][0]}<br><button class="linklike" style="color:var(--blue);padding:0" data-ck-do="goto" data-s="2">Edit</button></div></div></div>
    <label class="ck-terms"><input type="checkbox" id="ckTerms" ${CK.terms?'checked':''}><span>I agree to the terms of sale and the 30-day returns policy.<span class="ck-err" data-for="terms" style="display:${CK.err.terms?'block':'none'}">${CK.err.terms||''}</span></span></label>`;
}
function ckRender(){
  const app=$('#app');
  if(CK.done){const o=CK.done;
    app.innerHTML=`<div class="container ck-wrap"><div class="ck-done"><span class="eico">${ic('check','big')}</span><h1>Thank you, ${esc((o.ship.name||'').split(' ')[0])}!</h1><p class="muted">Order <b class="mono">${o.id}</b> is confirmed. A receipt is on its way to ${esc(o.ship.email)}.</p>
    <div class="ck-card"><div class="ck-row"><span>Estimated delivery</span><b>${new Date(o.eta).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</b></div><div class="ck-row"><span>Delivery method</span><b>${DELIV[o.method].n}</b></div><div class="ck-row"><span>Payment</span><b>${o.pay}</b></div><div class="ck-row"><span>Items</span><b>${o.items.reduce((a,i)=>a+i.qty,0)}</b></div><div class="ck-row tot"><span>Total paid</span><span class="mono">${money(o.total)}</span></div></div>
    <div class="ck-cta"><a class="btn btn-solid" href="#/account">View my orders</a><a class="btn btn-line" href="#/shop">Keep shopping</a></div></div></div>`;return;}
  if(!ckLines().length){app.innerHTML=`<div class="container ck-wrap"><div class="ck-done"><span class="eico">${ic('cart','big')}</span><h1>Your cart is empty</h1><p class="muted">Add a few parts to start checking out.</p><div class="ck-cta"><a class="btn btn-solid" href="#/shop">Browse components</a></div></div></div>`;return;}
  if(!user){app.innerHTML=`<div class="container ck-wrap"><div class="ck-done"><span class="eico">${ic('lock','big')}</span><h1>Sign in to check out</h1><p class="muted">Your cart is saved. Sign in to track orders and speed up future purchases.</p><div class="ck-cta"><button class="btn btn-solid" data-ck-do="signin">Sign in / Register</button></div></div></div>`;return;}
  const steps=['Shipping','Payment','Review'];
  app.innerHTML=`<div class="container ck-wrap"><div class="ck-head"><h1>Checkout</h1><span class="ck-secure">${ic('lock','sm')} Secure checkout</span></div>
  <div class="ck-steps">${steps.map((n,i)=>`<div class="ck-step ${CK.step===i+1?'on':CK.step>i+1?'done':''}" ${CK.step>i+1?`data-ck-do="goto" data-s="${i+1}"`:''}><i>${CK.step>i+1?'✓':i+1}</i><span>${n}</span></div>`).join('')}</div>
  <div class="ck-grid"><div>${ckMain()}<div class="ck-nav">${CK.step>1?'<button class="btn btn-line" data-ck-do="back">Back</button>':'<a class="btn btn-line" href="#/shop">Keep shopping</a>'}<button class="btn btn-solid" data-ck-do="${CK.step===3?'place':'next'}" ${CK.busy?'disabled':''}>${CK.step===3?(CK.busy?'Processing…':'Place order · '+money(ckTotals().total)):'Continue'}</button></div></div>${ckSum()}</div></div>`;
}
function ckStep(n){CK.step=n;ckRender();window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'})}
function ckFocusErr(){const e=$('.ck-err:not(:empty)');const i=e&&e.parentElement.querySelector('input,select');i&&i.focus({preventScroll:false})}
function ckPlace(){
  if(CK.busy||!ckValidate(3)){ckRender();return;}
  CK.busy=true;ckRender();
  setTimeout(()=>{
    const t=ckTotals(),items=ckLines().map(l=>({id:l.p.id,qty:l.q})),n=(CK.card.num||'').replace(/\s/g,'');
    const order={id:'VCX-'+Math.floor(100000+Math.random()*900000),date:new Date().toISOString(),items,subtotal:t.sub,discount:t.disc,promo:CK.promo,shipping:t.ship,total:t.total,status:'Processing',method:CK.method,ship:{...CK.ship},pay:CK.pay==='card'?'Card •••• '+n.slice(-4):PAYS[CK.pay][0],eta:new Date(Date.now()+DELIV[CK.method].days*864e5).toISOString()};
    orders.unshift(order);saveOrders();
    try{localStorage.setItem('vertex-ship',JSON.stringify(CK.ship))}catch(e){}
    cart={};saveCart();badge();CK.card={};CK.promo=null;CK.pmsg=null;CK.busy=false;CK.done=order;
    ckRender();window.scrollTo(0,0);toast(`Order ${order.id} placed`,'check');
  },1100);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-ck-do]');if(!el)return;
  const a=el.dataset.ckDo;
  if(a==='totop')window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
  else if(a==='signin'){pendingAuth='checkout';openAuth('signin','Sign in to complete your order');}
  else if(a==='next'){if(ckValidate(CK.step))ckStep(CK.step+1);else{ckRender();ckFocusErr();}}
  else if(a==='back')ckStep(CK.step-1);
  else if(a==='goto'&&+el.dataset.s<CK.step)ckStep(+el.dataset.s);
  else if(a==='place')ckPlace();
  else if(a==='unpromo'){CK.promo=null;CK.pmsg=null;ckRender();}
  else if(a==='promo'){
    const c=($('#ckPromo').value||'').trim().toUpperCase(),pr=PROMOS[c],sub=ckTotals().sub;
    if(!pr)CK.pmsg={t:'That code isn’t valid',ok:0};
    else if(pr.t==='amt'&&sub<pr.min)CK.pmsg={t:`${c} needs a subtotal of ${money(pr.min)}+`,ok:0};
    else{CK.promo=c;CK.pmsg={t:`${c} applied — ${pr.l}`,ok:1};}
    ckRender();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.ck;if(!k)return;
  let v=t.value;
  if(k==='c.num'){v=v.replace(/\D/g,'').slice(0,19).replace(/(.{4})/g,'$1 ').trim();t.value=v}
  if(k==='c.exp'){v=v.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);t.value=v}
  if(k==='c.cvc'){v=v.replace(/\D/g,'').slice(0,4);t.value=v}
  (k.startsWith('c.')?CK.card:CK.ship)[k.replace('c.','')]=v;
  if(CK.err[k]){delete CK.err[k];const s=$(`[data-for="${k}"]`);if(s)s.textContent='';t.closest('.ckf').classList.remove('bad');}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='ckm'){CK.method=t.value;ckRender();}
  else if(t.name==='ckp'){CK.pay=t.value;CK.err={};ckRender();}
  else if(t.id==='ckTerms'){CK.terms=t.checked;if(t.checked){delete CK.err.terms;const s=$('[data-for="terms"]');if(s)s.style.display='none';}}
  else if(t.dataset&&t.dataset.ck){(t.dataset.ck.startsWith('c.')?CK.card:CK.ship)[t.dataset.ck.replace('c.','')]=t.value;delete CK.err[t.dataset.ck];}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ckPromo'){e.preventDefault();const b=$('[data-ck-do="promo"]');b&&b.click();}});

/* ================= boot ================= */
initChrome();
badge();
onRoute();
</script>
</body>
</html>
